# Local ingestion stack.
#
#   docker compose up -d postgres              the store, always on
#   docker compose run --rm ingest list        what sources exist
#   docker compose run --rm ingest run --all   one manual pass over every source
#   docker compose up -d airflow-init           # once, then:
#   docker compose up -d                        # the Airflow scheduler runs everything
#   docker compose up -d capture               the order book recorder, always on
#
# Scheduling is Airflow's job (see airflow/dags/data_ingest_dags.py and the
# README's Scheduling section); its UI is at http://127.0.0.1:8080. `ingest`
# below stays for manual/ad-hoc runs and CI, unrelated to the schedule.
#
# Postgres is not published off the host (127.0.0.1 only). Other local stacks
# (e.g. quant-modeling) reach it over the shared `dataplatform` docker network
# by container name — create it once with:  docker network create dataplatform

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: data-ingest-airflow:latest
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Where a task (run by the scheduler's LocalExecutor) reaches Airflow's
    # execution API. Unset, Airflow 3 defaults to localhost:8080 — the
    # scheduler's own container, where nothing listens — and every task dies
    # with "Connection refused" before its first log line.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET must be set in .env}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Read by the DAGs themselves (data_ingest.config.dsn / require), same
    # values the `ingest` service below gets — this is the *data* Postgres,
    # unrelated to AIRFLOW__DATABASE__SQL_ALCHEMY_CONN above.
    PGHOST: postgres
    PGPORT: 5432
    PGDATABASE: ${PGDATABASE:-dataingest}
    PGUSER: ${PGUSER:-dataingest}
    PGPASSWORD: ${PGPASSWORD}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    FRED_API_KEY: ${FRED_API_KEY:-}
    FRED_SERIES: ${FRED_SERIES:-}
    FX_SERIES: ${FX_SERIES:-}
    OPTIONS_CHAIN_TICKERS: ${OPTIONS_CHAIN_TICKERS:-}
    SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    SEC_TICKERS: ${SEC_TICKERS:-}
    CAPTURE_DIR: /data/capture
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    # What the `capture` service records, for the capture-catalogue source.
    - ${CAPTURE_DIR:-./data/capture}:/data/capture:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: data-ingest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-dataingest}
      POSTGRES_USER: ${PGUSER:-dataingest}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default
      - dataplatform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-dataingest} -d ${PGDATABASE:-dataingest}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingest:
    build: .
    image: data-ingest:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-dataingest}
      PGUSER: ${PGUSER:-dataingest}
      PGPASSWORD: ${PGPASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRED_API_KEY: ${FRED_API_KEY:-}
      FRED_SERIES: ${FRED_SERIES:-}
      FX_SERIES: ${FX_SERIES:-}
      OPTIONS_CHAIN_TICKERS: ${OPTIONS_CHAIN_TICKERS:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      SEC_TICKERS: ${SEC_TICKERS:-}
      CAPTURE_DIR: /data/capture
    volumes:
      - ${CAPTURE_DIR:-./data/capture}:/data/capture:ro
    # Runs to completion: for manual/ad-hoc runs only. The schedule itself is
    # Airflow's job now (airflow-scheduler below), not this container's.
    restart: "no"
    command: ["run", "--all"]

  # --- Capture: the one service that is not a scheduled run. ---------------
  # Connections to Bitstamp's public order book feed that stay open and write
  # one event file per pair and per day (src/data_ingest/capture/). It needs
  # neither Postgres nor an account. It also compresses the days that are
  # over and removes the oldest ones above CAPTURE_MAX_GB. Recreating it
  # leaves a hole of a few seconds in the day's files, so it is only recreated
  # when its image changes.
  capture:
    build: .
    image: data-ingest:latest
    restart: unless-stopped
    # The host user, so that the files can be read and removed without sudo;
    # the directory must exist and belong to it (scripts/deploy.sh sees to it).
    user: "${CAPTURE_UID:-1000}:${CAPTURE_GID:-1000}"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CAPTURE_DIR: /data/capture
      CAPTURE_PAIRS: ${CAPTURE_PAIRS:-btcusd,nearusd}
      CAPTURE_MAX_GB: ${CAPTURE_MAX_GB:-40}
    volumes:
      - ${CAPTURE_DIR:-./data/capture}:/data/capture
    command: ["capture", "--pair", "${CAPTURE_PAIRS:-btcusd,nearusd}"]
    # Stopping waits for a snapshot request in flight before closing the files.
    stop_grace_period: 30s
    healthcheck:
      # The sidecar of each pair's open day is rewritten every 15 seconds.
      test: ["CMD-SHELL", "[ $$(find /data/capture -name '*.json' -mmin -2 | wc -l) -ge $$(echo $$CAPTURE_PAIRS | tr , ' ' | wc -w) ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- Airflow: the scheduler. See airflow/dags/data_ingest_dags.py. -------

  airflow-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Metadata store only, kept separate from `postgres` (the data
    # warehouse) so an Airflow schema migration can never touch ingested
    # data, and vice versa.

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /entrypoint airflow db migrate
        /entrypoint airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-airflow}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD must be set in .env}" \
          --firstname airflow --lastname airflow --role Admin \
          --email "${AIRFLOW_ADMIN_USER:-airflow}@localhost" || true
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  airflow-pgdata:

networks:
  dataplatform:
    external: true
